# iDRAC Tailscale Gateway Configuration
# This is just an EXAMPLE
# iDRAC Tailscale Gateway Configuration Template
# Copy this file to network.conf and customize for your environment
# Generated by configure.sh

# Network interface to use for LAN connection
# Examples: eth0, enp0s3, wlan0
# Run 'ip link show' to see available interfaces
NETWORK_INTERFACE="eth0"

# LAN subnet in CIDR notation
# This is the subnet that will be advertised to Tailscale
# Examples: 192.168.0.0/24, 10.0.0.0/16, 172.16.0.0/12
SUBNET="192.168.0.0/24"

# Gateway IP address
# Usually your router's IP address
# Examples: 192.168.0.1, 10.0.0.1, 192.168.1.254
GATEWAY="192.168.0.1"

# iDRAC IP address
# The IP address where your iDRAC interface is accessible
# This should be within the subnet specified above
IDRAC_IP="192.168.0.118"

# iDRAC MAC address (optional)
# Useful for documentation and DHCP reservations
# Format: XX:XX:XX:XX:XX:XX
IDRAC_MAC="44:A8:42:0C:11:02"

# Enable Tailscale SSH access
# Allows SSH access to this gateway through Tailscale
# Values: y, n, yes, no
ENABLE_SSH="y"

# Enable NAT/Masquerading
# Required if devices on LAN need to access internet through this gateway
# Recommended: y
# Values: y, n, yes, no
ENABLE_NAT="y"

# Install iptables-persistent
# Saves firewall rules across reboots
# Recommended: y
# Values: y, n, yes, no
INSTALL_IPTABLES="y"

# Configuration metadata
# These are automatically generated by configure.sh
# CONFIG_VERSION="2.0.0"
# CONFIG_DATE="2026-01-08"